name: Diagnose proxy parity
on:
  workflow_dispatch:
    inputs:
      proxies:
        description: "Comma-separated proxy URLs proven to work from home"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Probe the same proxies from here
        env:
          PROXIES: ${{ inputs.proxies }}
        run: |
          python - <<'PY'
          import os, requests
          from subito_alerts.subito import SEARCH_URL, HEADERS

          print("runner IP:", requests.get("https://api.ipify.org", timeout=15).text)
          for p in [x.strip() for x in os.environ["PROXIES"].split(",") if x.strip()]:
              px = {"http": p, "https": p}
              # 1. Can we reach the proxy at all, and what IP does it present?
              try:
                  egress = requests.get("https://api.ipify.org", proxies=px, timeout=20).text
              except Exception as e:
                  print(f"  {p:34} UNREACHABLE from runner: {type(e).__name__}")
                  continue
              # 2. Does subito accept a request through it?
              try:
                  r = requests.get(SEARCH_URL, params={"q":"bici","lim":2,"sort":"datedesc"},
                                   headers=HEADERS, proxies=px, timeout=25)
                  ads = len((r.json() or {}).get("ads", [])) if r.status_code == 200 else 0
                  print(f"  {p:34} egress={egress:16} subito={r.status_code} ads={ads}")
              except Exception as e:
                  print(f"  {p:34} egress={egress:16} subito failed: {type(e).__name__}")
          PY

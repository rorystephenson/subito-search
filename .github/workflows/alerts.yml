name: Subito alerts

# Dispatched by a cron on the VPS — see deploy-subito-trigger.sh in the infra
# repo. GitHub's own `schedule:` trigger is deliberately absent: it never fired
# once here, across an hour and a half of ticks on a correctly configured cron.
on:
  workflow_dispatch:
    inputs:
      searches:
        description: 'JSON list of searches: [{"query", "prompt", "filters"?}]'
        type: string
        default: ""
      dry_run:
        description: "Classify but don't send to Telegram"
        type: boolean
        default: false
      check_only:
        description: "Only verify connectivity and exit"
        type: boolean
        default: false

# Two overlapping runs would race on the state file and double-send.
concurrency:
  group: subito-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Fast, fully offline — catches a broken commit before it costs us a run.
      - name: Tests
        run: python -m unittest discover -s tests -t . -q

      # Cache entries are immutable, so we restore the newest by prefix and
      # save under a fresh key each run.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: subito-state-${{ github.run_id }}
          restore-keys: |
            subito-state-

      - name: Run alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Through the environment, never interpolated into the script:
          # prompts contain quotes, which would break the shell or inject into it.
          SUBITO_SEARCHES: ${{ inputs.searches }}
        run: |
          python -m subito_alerts.main \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.check_only && '--check' || '' }}

      # `always()` so a partial run still records what it already sent,
      # which prevents re-sending those ads next time.
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: subito-state-${{ github.run_id }}

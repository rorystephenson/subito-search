name: Subito alerts

on:
  schedule:
    # GENERATED from the `schedule` block in searches.yaml — do not hand-edit.
    #   python -m subito_alerts.main --sync-schedule
    # A test fails if this drifts from the config.
    #
    # Actions cron is UTC-only, so this is a superset of the local window: it
    # spans both of Rome's DST offsets, and the job itself exits immediately
    # when the real local time is outside the configured hours.
    # Note: GitHub often delays scheduled runs under load.
    - cron: "*/15 6-20 * * *"
  workflow_dispatch:
    inputs:
      ignore_interval:
        description: "Run every search regardless of its interval"
        type: boolean
        default: false
      dry_run:
        description: "Classify but don't send to Telegram"
        type: boolean
        default: false
      ignore_schedule:
        description: "Run even outside the configured active hours"
        type: boolean
        default: false

# Two overlapping runs would race on the state file and double-send.
concurrency:
  group: subito-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Fast, fully offline — catches a broken commit before it costs us a run.
      - name: Tests
        run: python -m unittest discover -s tests -t . -q

      # Cache entries are immutable, so we restore the newest by prefix and
      # save under a fresh key each run.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: subito-state-${{ github.run_id }}
          restore-keys: |
            subito-state-

      # Subito's Akamai edge refuses GitHub's ASN outright, so a runner needs
      # borrowed IPs. This tops the pool up when the cached one has died off;
      # it is a no-op while enough proxies are still known to work.
      - name: Refresh proxy pool
        run: python -m subito_alerts.main --refresh-proxies

      - name: Run alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python -m subito_alerts.main \
            ${{ inputs.ignore_interval && '--ignore-interval' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.ignore_schedule && '--ignore-schedule' || '' }}

      # `always()` so a partial run still records what it already sent,
      # which prevents re-sending those ads next time.
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: subito-state-${{ github.run_id }}

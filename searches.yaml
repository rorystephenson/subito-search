# WHEN this runs is not configured here. A cron on the VPS dispatches the
# GitHub Actions workflow; see deploy-subito-trigger.sh in the infra repo.
# Running this command just runs every search once.

# How the HTTP client presents itself to subito.
#
# Subito sits behind Akamai, which scores the client's TLS and HTTP/2
# fingerprint rather than just the address it came from. A plain HTTP library is
# refused with 403; curl_cffi reproducing a real Chrome handshake is accepted —
# including from GitHub's runners, where a plain library is not.
#
# If alerts stop and `--check` reports a 403, this is the setting to change:
# roll it forward to a newer profile. curl_cffi ships the list it supports.
#
fetch:
  impersonate: chrome136

# Applied to every search unless the search overrides them.
defaults:
  cold_start_minutes: 30
  max_pages: 2

# Empty between hunts: runs still fire, but do nothing. Add a search here to
# resume. The last one (pixel-10-pro-xl) is in git history as a template.
searches: []

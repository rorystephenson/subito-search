# When the bot is allowed to run, in LOCAL time.
#
# This is the single source of truth for scheduling. GitHub's cron is UTC-only
# and Rome shifts between UTC+1 and UTC+2, so the workflow's cron is *derived*
# from this block — regenerate it with:
#
#     python -m subito_alerts.main --sync-schedule
#
schedule:
  timezone: Europe/Rome
  active_hours: "08:00-22:00"   # end is exclusive: last run starts before 22:00
  # days: [mon, tue, wed, thu, fri]   # optional; defaults to every day

# How to reach subito when this machine's IP is blocked.
#
# Subito sits behind Akamai, which refuses the big cloud ASNs outright: a
# GitHub-hosted runner gets HTTP 403 on everything, while a home connection is
# fine. In "auto" the bot connects directly and only falls back to borrowed IPs
# when that fails, so running locally costs nothing.
#
# Only subito searches are ever proxied. Telegram and Gemini carry credentials
# and always connect directly — these proxies are run by strangers.
#
#   python -m subito_alerts.main --refresh-proxies
#
proxies:
  mode: auto            # auto (direct first) | always (proxy only) | never
  min_pool: 3           # top up when fewer than this many are known to work
  max_attempts: 6       # transports to try before giving up on a request
  # sources:            # defaults to the VPSLab socks5 + ssl-elite lists
  #   - https://raw.githubusercontent.com/VPSLabCloud/VPSLab-Free-Proxy-List/main/socks5_all.txt

# Applied to every search unless the search overrides them.
defaults:
  interval_minutes: 60
  max_pages: 2

searches:
  - name: bici-da-corsa
    query: "bici da corsa"
    interval_minutes: 15

    filters:
      price_min: 200
      price_max: 600
      shippable: true      # only ads the seller will ship
      # title_only: true   # match the query against the title only
      # category: 41       # subito category id (41 = Biciclette)
      # region: 12         # subito region id (12 = Lazio)

    # Cheap local reject list, applied before the LLM sees anything.
    # Use it for words that are *always* wrong — it saves LLM quota.
    exclude_keywords:
      - bambino
      - bimbo
      - ricambi

    # The important bit: plain English, as specific as you can be about both
    # what you want and what you don't.
    prompt: >
      A complete road bike (bici da corsa) in frame size 54-56, carbon or good
      quality aluminium, with Shimano 105 groupset or better, in ridable
      condition. Not interested in: frames sold alone, spare parts, wheels,
      accessories, mountain bikes, gravel bikes, city bikes, e-bikes, or
      anything described as needing significant restoration.
